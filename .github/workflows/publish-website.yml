# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Publish Website

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # PHP runtime only (no Composer or other tools/extensions)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json

      # Node for building the Sheet app (mounted at /sheet)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: sheet-app/yarn.lock

      # Builds into website/public/sheet (see sheet-app/vite.config.ts), so Jekyll
      # publishes it at https://dipakw.github.io/sheet/
      - name: Build Sheet app
        run: |
          cd sheet-app
          yarn install --frozen-lockfile
          yarn build

      - name: Move scripts
        run: |
          mv scripts website/public/@

      - name: Generate
        run: |
          cd website
          ./generate

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website/public
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
