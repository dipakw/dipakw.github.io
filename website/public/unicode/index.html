	<div class="body">
		<div class="conversion-area">

			<!-- preeti to unicode -->
			<div class="inputs active">
				<div class="input input1 bsb">
					<div class="control bsb">
						<span class="input-title">प्रिति फन्टका अक्षरहरु</span>
					</div>
					<textarea class="bsb preeti_text" id="legacy_text" onkeyup="convert_to_unicode()"
						spellcheck="false"></textarea>
				</div>
				<div class="input input2 bsb">
					<div class="control bsb">
						<span class="input-title">नेपाली युनिकोड</span>
					</div>
					<textarea class="bsb unicode_text" id="unicode_text" spellcheck="false"></textarea>
					<span class="copied">Copied!</span>
				</div>
				<select id="text_or_html" style="display: none;">
					<option selected="selected">&nbsp;</option>
				</select>
			</div>

			<!-- unicode to preeti -->
			<div class="inputs">
				<div class="input input1 bsb">
					<div class="control bsb">
						<span class="input-title">नेपाली युनिकोड</span>
					</div>
					<textarea class="bsb unicode_text" id="u2p_unicode" spellcheck="false"></textarea>
				</div>
				<div class="input input2 bsb">
					<div class="control bsb">
						<span class="input-title">प्रिति फन्टका अक्षरहरु</span>
					</div>
					<textarea class="bsb preeti_text" id="u2p_preeti" spellcheck="false"></textarea>
					<span class="copied">Copied!</span>
				</div>
			</div>

		</div>
	</div>

	<textarea id="bin" style="height:10px;width:10px;position:fixed;top:-50px;left:-50px;"></textarea>
	<div style="display:none;"><img id="cc" /></div>
